<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地镜像仓库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        h1 { font-size: 2rem; margin-bottom: 8px; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #94a3b8; margin-bottom: 32px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; padding: 20px; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #60a5fa; }
        .stat-label { color: #94a3b8; font-size: 0.875rem; margin-top: 4px; }
        .repositories { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; overflow: hidden; }
        .repo-header { padding: 16px 20px; border-bottom: 1px solid rgba(148, 163, 184, 0.2); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .repo-item { padding: 16px 20px; border-bottom: 1px solid rgba(148, 163, 184, 0.1); cursor: pointer; transition: background 0.2s; }
        .repo-item:hover { background: rgba(96, 165, 250, 0.1); }
        .repo-item:last-child { border-bottom: none; }
        .repo-name { font-weight: 500; color: #60a5fa; font-size: 1rem; }
        .repo-tags { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag { background: rgba(96, 165, 250, 0.2); color: #60a5fa; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }
        .loading { text-align: center; padding: 40px; color: #94a3b8; }
        .error { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 16px 20px; border-radius: 8px; margin-bottom: 16px; }
        .empty { text-align: center; padding: 60px; color: #64748b; }
        .refresh-btn { background: rgba(96, 165, 250, 0.2); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3); padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 0.875rem; transition: all 0.2s; }
        .refresh-btn:hover { background: rgba(96, 165, 250, 0.3); }
        .manifest-detail { background: rgba(15, 23, 42, 0.6); border-radius: 8px; padding: 12px 16px; margin-top: 12px; font-size: 0.8rem; }
        .manifest-detail pre { overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
        .copy-btn { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; margin-left: 8px; }
        .copy-btn:hover { background: rgba(148, 163, 184, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h1>本地镜像仓库</h1>
        <p class="subtitle">Docker Registry v2 · http://localhost:5001</p>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="repoCount">-</div>
                <div class="stat-label">仓库数量</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="tagCount">-</div>
                <div class="stat-label">镜像标签数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="registryStatus">-</div>
                <div class="stat-label">Registry 状态</div>
            </div>
        </div>

        <div class="repositories">
            <div class="repo-header">
                <span>镜像仓库列表</span>
                <button class="refresh-btn" onclick="loadRepositories()">刷新</button>
            </div>
            <div id="repoList">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        const REGISTRY_URL = '/api/registry';

        async function fetchWithCORS(path) {
            const url = REGISTRY_URL + path;
            try {
                const response = await fetch(url, {
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (e) {
                throw e;
            }
        }

        async function loadRepositories() {
            const listEl = document.getElementById('repoList');
            listEl.innerHTML = '<div class="loading">加载中...</div>';
            document.getElementById('registryStatus').textContent = '检查中';

            try {
                const data = await fetchWithCORS('/v2/_catalog');
                const repos = data.repositories || [];

                document.getElementById('repoCount').textContent = repos.length;
                document.getElementById('registryStatus').textContent = '在线';
                document.getElementById('registryStatus').style.color = '#4ade80';

                let totalTags = 0;
                const repoDetails = await Promise.all(
                    repos.map(async (name) => {
                        try {
                            const tagData = await fetchWithCORS(`/v2/${name}/tags/list`);
                            const tags = tagData.tags || [];
                            totalTags += tags.length;
                            return { name, tags };
                        } catch {
                            return { name, tags: [] };
                        }
                    })
                );

                document.getElementById('tagCount').textContent = totalTags;

                if (repos.length === 0) {
                    listEl.innerHTML = '<div class="empty">暂无镜像仓库</div>';
                    return;
                }

                listEl.innerHTML = repoDetails.map(repo => {
                    const tagsHtml = repo.tags.length > 0
                        ? `<div class="tag-list">${repo.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>`
                        : '<div class="repo-tags">无标签</div>';
                    return `<div class="repo-item">
                        <div class="repo-name">${escapeHtml(repo.name)}</div>
                        <div class="repo-tags">标签数: ${repo.tags.length}</div>
                        ${tagsHtml}
                    </div>`;
                }).join('');

            } catch (err) {
                document.getElementById('registryStatus').textContent = '离线';
                document.getElementById('registryStatus').style.color = '#ef4444';
                document.getElementById('repoCount').textContent = '0';
                document.getElementById('tagCount').textContent = '0';
                listEl.innerHTML = `<div class="error">
                    <strong>连接失败</strong><br>
                    无法连接到 Registry: ${REGISTRY_URL}<br>
                    错误: ${escapeHtml(err.message)}<br><br>
                    请确保 Registry 容器已启动:<br>
                    <code>docker ps | grep registry</code>
                </div>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadRepositories();
    </script>
</body>
</html>
