version: "3.8"

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: devtools-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=--httpPort=8080
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./casc:/var/jenkins_home/casc:ro
      - ../:/workspace:ro
    networks:
      - jenkins-network

  # Optional: Local Docker Registry for testing ( mirrors production )
  registry:
    image: registry:2
    container_name: devtools-registry
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - jenkins-network

volumes:
  jenkins_home:
  registry_data:

networks:
  jenkins-network:
    driver: bridge
