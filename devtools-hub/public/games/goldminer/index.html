<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄金矿工</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a0a00;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Arial', sans-serif;
  overflow: hidden;
}
canvas { border: 3px solid #8B6914; border-radius: 8px; box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); }
#ui {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: gold;
  font-size: 24px;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  pointer-events: none;
}
</style>
</head>
<body>
<div id="ui">得分: <span id="score">0</span> | 目标: <span id="target">650</span> | 关卡: <span id="level">1</span></div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 600;

let score = 0, level = 1, targetScore = 650;
let claw = { angle: 0, length: 50, maxLength: 400, speed: 1.5, extending: false, retracting: false, x: 400, y: 80 };
let items = [];
let gameState = 'playing'; // playing, extending, retracting
let grabbedItem = null;
let hookX = 400, hookY = 80;
let swingDir = 1;

// Item types: gold sizes and values
const itemTypes = [
  { name: '大金块', color: '#FFD700', size: 45, value: 250, weight: 1 },
  { name: '中金块', color: '#FFC107', size: 35, value: 150, weight: 1.3 },
  { name: '小金块', color: '#FFB300', size: 25, value: 100, weight: 1.5 },
  { name: '钻石', color: '#00E5FF', size: 22, value: 600, weight: 0.5 },
  { name: '石头', color: '#757575', size: 40, value: 20, weight: 3 },
  { name: '大石头', color: '#616161', size: 55, value: 11, weight: 5 },
];

function spawnItems() {
  items = [];
  for (let i = 0; i < 8 + level; i++) {
    const type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
    items.push({
      x: 80 + Math.random() * 640,
      y: 180 + Math.random() * 350,
      type: type,
      grabbed: false
    });
  }
}

function drawBackground() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, 160);
  sky.addColorStop(0, '#87CEEB');
  sky.addColorStop(1, '#E0F7FA');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 800, 160);

  // Ground
  const ground = ctx.createLinearGradient(0, 160, 0, 600);
  ground.addColorStop(0, '#8B6914');
  ground.addColorStop(0.3, '#6B4F12');
  ground.addColorStop(1, '#3E2B06');
  ctx.fillStyle = ground;
  ctx.fillRect(0, 160, 800, 440);

  // Ground texture
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  for (let i = 0; i < 15; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 180 + i * 30);
    ctx.quadraticCurveTo(400, 175 + i * 30, 800, 185 + i * 30);
    ctx.stroke();
  }

  // Sun
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(100, 80, 40, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFF176';
  ctx.beginPath();
  ctx.arc(100, 80, 25, 0, Math.PI * 2);
  ctx.fill();
}

function drawClaw() {
  const rad = claw.angle * Math.PI / 180;
  const endX = claw.x + Math.cos(rad) * claw.length;
  const endY = claw.y + Math.sin(rad) * claw.length;

  // Rope
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(claw.x, claw.y);
  ctx.lineTo(endX, endY);
  ctx.stroke();

  // Claw mechanism
  ctx.fillStyle = '#5D4037';
  ctx.beginPath();
  ctx.arc(endX, endY, 8, 0, Math.PI * 2);
  ctx.fill();

  // Claw fingers
  const fingerAngle = 25;
  for (let i = -1; i <= 1; i += 2) {
    const fa = rad + i * fingerAngle * Math.PI / 180;
    ctx.strokeStyle = '#4E342E';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(endX, endY);
    ctx.lineTo(endX + Math.cos(fa) * 18, endY + Math.sin(fa) * 18);
    ctx.stroke();
    // Tip
    ctx.fillStyle = '#3E2723';
    ctx.beginPath();
    ctx.arc(endX + Math.cos(fa) * 18, endY + Math.sin(fa) * 18, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  return { endX, endY };
}

function drawItems() {
  for (const item of items) {
    if (item.grabbed) continue;
    const t = item.type;
    ctx.save();
    ctx.translate(item.x, item.y);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.arc(3, 3, t.size / 2, 0, Math.PI * 2);
    ctx.fill();

    // Main body
    const grad = ctx.createRadialGradient(-t.size*0.2, -t.size*0.2, t.size*0.1, 0, 0, t.size/2);
    grad.addColorStop(0, lightenColor(t.color, 40));
    grad.addColorStop(0.7, t.color);
    grad.addColorStop(1, darkenColor(t.color, 40));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, t.size / 2, 0, Math.PI * 2);
    ctx.fill();

    // Label
    ctx.fillStyle = '#000';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('$' + t.value, 0, 3);

    ctx.restore();
  }
}

function lightenColor(color, percent) {
  const num = parseInt(color.replace('#', ''), 16);
  const r = Math.min(255, (num >> 16) + percent);
  const g = Math.min(255, ((num >> 8) & 0xFF) + percent);
  const b = Math.min(255, (num & 0xFF) + percent);
  return '#' + (r << 16 | g << 8 | b).toString(16).padStart(6, '0');
}

function darkenColor(color, percent) {
  const num = parseInt(color.replace('#', ''), 16);
  const r = Math.max(0, (num >> 16) - percent);
  const g = Math.max(0, ((num >> 8) & 0xFF) - percent);
  const b = Math.max(0, (num & 0xFF) - percent);
  return '#' + (r << 16 | g << 8 | b).toString(16).padStart(6, '0');
}

function update() {
  if (gameState === 'playing') {
    // Swing claw
    claw.x = 400;
    claw.length = 50;
    claw.angle += claw.speed * swingDir;
    if (claw.angle > 160) swingDir = -1;
    if (claw.angle < 20) swingDir = 1;
  } else if (gameState === 'extending') {
    claw.length += 4;
    if (claw.length >= claw.maxLength) {
      gameState = 'retracting';
    }
    // Check collision
    const rad = claw.angle * Math.PI / 180;
    const hx = claw.x + Math.cos(rad) * claw.length;
    const hy = claw.y + Math.sin(rad) * claw.length;
    for (const item of items) {
      if (item.grabbed) continue;
      const dx = hx - item.x;
      const dy = hy - item.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < item.type.size / 2 + 10) {
        grabbedItem = item;
        item.grabbed = true;
        claw.maxLength = claw.length;
        gameState = 'retracting';
        break;
      }
    }
  } else if (gameState === 'retracting') {
    const speed = grabbedItem ? 2 / grabbedItem.type.weight : 3;
    claw.length -= speed;
    if (grabbedItem) {
      const rad = claw.angle * Math.PI / 180;
      grabbedItem.x = claw.x + Math.cos(rad) * claw.length;
      grabbedItem.y = claw.y + Math.sin(rad) * claw.length;
    }
    if (claw.length <= 50) {
      if (grabbedItem) {
        score += grabbedItem.type.value;
        document.getElementById('score').textContent = score;
        items = items.filter(i => i !== grabbedItem);
        grabbedItem = null;
      }
      gameState = 'playing';
      claw.length = 50;
      if (score >= targetScore) {
        level++;
        targetScore += Math.floor(650 * level * 0.8);
        document.getElementById('target').textContent = targetScore;
        document.getElementById('level').textContent = level;
        score = 0;
        document.getElementById('score').textContent = '0';
        spawnItems();
      }
      if (items.length === 0) {
        spawnItems();
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, 800, 600);
  drawBackground();
  drawItems();
  if (grabbedItem && grabbedItem.grabbed) {
    ctx.save();
    ctx.translate(grabbedItem.x, grabbedItem.y);
    const t = grabbedItem.type;
    const grad = ctx.createRadialGradient(-t.size*0.2, -t.size*0.2, t.size*0.1, 0, 0, t.size/2);
    grad.addColorStop(0, lightenColor(t.color, 40));
    grad.addColorStop(0.7, t.color);
    grad.addColorStop(1, darkenColor(t.color, 40));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, t.size / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('$' + t.value, 0, 3);
    ctx.restore();
  }
  drawClaw();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

canvas.addEventListener('click', () => {
  if (gameState === 'playing') {
    gameState = 'extending';
    claw.maxLength = 400;
    grabbedItem = null;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowDown') {
    e.preventDefault();
    if (gameState === 'playing') {
      gameState = 'extending';
      claw.maxLength = 400;
      grabbedItem = null;
    }
  }
});

spawnItems();
gameLoop();
</script>
</body>
</html>
